[package]
name = "osmium-web"
version = "0.3.0"
edition = "2021"
publish = false
description = "Browser build of Osmium (same format as the command-line tool)."

[lib]
crate-type = ["cdylib"]

[dependencies]
osmium = { path = ".." }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
