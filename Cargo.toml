[package]
name = "osmium"
version = "0.2.0"
edition = "2021"
description = "Context-mixing compressor for text, built around the Hutter Prize data (enwik8/enwik9)"
license = "MIT"
repository = "https://github.com/Aetherx86/osmium"

[lib]
path = "src/lib.rs"

[[bin]]
name = "osmium"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
